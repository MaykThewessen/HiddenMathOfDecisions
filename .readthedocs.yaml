# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Project is not Sphinx/MkDocs — it's a single Readme.md rendered to static HTML
# by build_site.py. Use build.commands to run that builder and publish docs/.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - pip install --no-cache-dir markdown numpy matplotlib
    - python decision_math.py --plot
    - python generate_extra_charts.py
    - python build_site.py
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -R docs/. "$READTHEDOCS_OUTPUT/html/"
